<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>relay-hub Console</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#6b7280; --line:#e5e7eb; --brand:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#e8e8ea; --muted:#9ca3af; --line:#2a2c30; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 system-ui, "Segoe UI", sans-serif; }
  header { padding:28px 32px 8px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:20px; padding: 20px 32px 32px; align-items:start; }
  .card { border:1px solid var(--line); border-radius:12px; padding:18px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  .row { display:flex; gap:10px; margin-top:14px; }
  button { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  #probe { margin-top:12px; font-size:13px; min-height:20px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#9ca3af; }
  .dot.online{background:#16a34a} .dot.auth_failed{background:#dc2626} .dot.unreachable{background:#9ca3af}
  .dot.incompatible{background:#d97706} .dot.third_party{background:#7c3aed}
  .site { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .site:last-child { border-bottom:0; }
  .site small { color:var(--muted); }
  .q { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:12px; }
  details { margin-top:14px; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>管理你的本地或远程 relay-hub 实例</h1>
  <div class="sub">不代理流量、不存储上游 Key · 密码存系统钥匙串</div>
  <div id="live" class="hint"></div>
</header>

<main>
  <section class="card">
    <strong>连接已有实例</strong>
    <label>地址</label>
    <input id="base" placeholder="http://127.0.0.1:18802 或 https://your.site" />
    <label>管理员账号</label>
    <input id="user" autocomplete="username" placeholder="用户名" />
    <label>密码</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="密码" />
    <div class="row">
      <button id="test">测试连接</button>
      <button id="save" class="primary" disabled>保存站点</button>
    </div>
    <div id="probe"></div>
    <details>
      <summary>还没有 relay-hub？创建一个实例</summary>
      <p class="hint">MVP 将调用本机 Python（检测 <code>python3</code> / <code>hubrelay</code>），
      可选端口、监听地址、管理 Token、数据目录与开机自启；不捆绑运行时、不需要 Docker。</p>
      <button id="create">检测并启动实例</button>
      <span class="hint" id="createMsg"></span>
    </details>
  </section>

  <section class="card" id="ch">
    <strong>渠道</strong>
    <div class="row"><button id="ch-load">刷新</button><span class="hint" id="ch-msg"></span></div>
    <div id="ch-out" style="margin-top:10px;overflow-x:auto"></div>
  </section>

  <section class="card" id="tk">
    <strong>令牌</strong>
    <div class="row"><button id="tk-load">刷新</button><span class="hint" id="tk-msg"></span></div>
    <div id="tk-out" style="margin-top:10px;overflow-x:auto"></div>
  </section>

  <section class="card" id="plug" style="grid-column:1/-1">
    <strong>插件用量</strong>
    <span class="hint">（来自 pluginlogs，按天聚合；无成本字段，成本需按价格表折算）</span>
    <div class="row">
      <input id="days" type="number" min="1" max="90" value="7" style="width:90px" />
      <button id="plug-load">刷新</button>
      <button id="plug-csv">导出 CSV</button>
      <span class="hint" id="plug-msg"></span>
    </div>
    <div id="plug-out" style="margin-top:10px;overflow-x:auto"></div>
  </section>

  <aside class="card">
    <strong>站点</strong>
    <div id="sites" style="margin-top:6px"></div>
  </aside>
</main>

<script src="main.js"></script>
</body>
</html>
